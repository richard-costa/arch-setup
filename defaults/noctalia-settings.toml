# First-install Noctalia preferences.
#
# install/dotfiles.sh copies this to Noctalia's app-managed settings.toml only
# when that file does not already exist. After first boot, Noctalia owns the
# copied file and GUI changes work normally.

[bar.default]
start = [ "launcher", "workspaces" ]
center = [ "wallpaper", "mpvpaper", "clock" ]

[location]
auto_locate = true

[plugins]
enabled = [ "noctalia/mpvpaper" ]

[plugin_settings."noctalia/mpvpaper"]
video_directory = "@HOME@/Videos"

[shell]
app_icon_colorize = true

[shell.greeter_sync]
auto_sync = true

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
enable_builtin_templates = true
enable_community_templates = true
builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri" ]
community_ids = [ "pywalfox", "obsidian", "vscode", "fastfetch", "yazi" ]

[wallpaper]
directory = "@HOME@/Pictures/Wallpapers"
fill_mode = "fit"
fill_color = "shadow"

[wallpaper.automation]
enabled = true
interval_seconds = 600

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"
