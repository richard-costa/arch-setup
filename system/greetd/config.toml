# greetd launches the Noctalia Greeter session wrapper on VT1.
#
# The wrapper starts Noctalia Greeter's small wlroots compositor and handles
# the D-Bus session needed by the greeter. Do not point this directly at the
# noctalia-greeter binary.

[terminal]
vt = 1

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greeter"
