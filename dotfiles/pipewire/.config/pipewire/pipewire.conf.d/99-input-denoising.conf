context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Clean Microphone"
            media.name = "Clean Microphone"

            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 30.0
                            "VAD Grace Period (ms)" = 400
                            "Retroactive VAD Grace (ms)" = 100
                        }
                    }
                ]
            }

            capture.props = {
                node.name = "capture.rnnoise_source"
                node.passive = true
                audio.rate = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }

            playback.props = {
                node.name = "rnnoise_source"
                node.description = "Clean Microphone"
                media.class = Audio/Source
                audio.rate = 48000
                audio.channels = 1
                audio.position = [ MONO ]
            }
        }
    }
]
